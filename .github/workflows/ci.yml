name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: new CVEs appear even when the code doesn't change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  image:
    name: Build, Grype scan, smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t rate-limiter:ci .

      # Pinned to the full commit SHA of v7.4.0 (tags can be force-pushed).
      # The action pins its own Grype version; bump it by updating this SHA.
      - name: Scan image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: rate-limiter:ci
          severity-cutoff: high     # fail on HIGH and CRITICAL
          only-fixed: true          # ignore vulnerabilities with no fix available
          fail-build: true

      - name: Start the stack and wait for health checks
        run: docker compose up -d --build --wait --wait-timeout 90

      - name: Smoke test
        run: |
          set -e
          body='{"client_id":"ci","capacity":2,"refill_rate":0.001}'
          call() { curl -fsS -X POST localhost:8000/v1/check \
                     -H 'content-type: application/json' -d "$body"; }
          call | tee /dev/stderr | grep -q '"allowed":true'
          call | tee /dev/stderr | grep -q '"allowed":true'
          call | tee /dev/stderr | grep -q '"allowed":false'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v